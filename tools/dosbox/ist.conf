# DOSBox-X reference configuration for IST.EXE (the oracle for 1:1 comparisons).
# usage: dosbox-x.exe -conf tools/dosbox/ist.conf     (run from the repo root)
[sdl]
output        = surface
windowresolution = original
autolock      = false

[dosbox]
machine       = vgaonly
memsize       = 16
captures      = build/capture
quit warning  = false
working directory option = noprompt

[cpu]
core          = normal
cputype       = 486
fpu           = true    # reference = x87 hardware path (see docs/CONVENTIONS.md section 5)
cycles        = fixed 20000

[dos]
ems           = true
xms           = true
umb           = true

[mixer]
rate          = 44100

[sblaster]
# must match the game's SES.CFG (written by KUR.EXE): SB16 at 220h, IRQ 7,
# 16-bit DMA 5.  With irq = 5 the DSMI driver unmasks IRQ 7, never sees the
# SB16 interrupt and the DMA stalls (no sound, the voice
# waits in ui_wait_voice never end: the channel position stays 0).
sbtype        = sb16
sbbase        = 220
irq           = 7
dma           = 1
hdma          = 5

[render]
aspect        = false
scaler        = none

[autoexec]
mount c "orig"
c:
IST.EXE
