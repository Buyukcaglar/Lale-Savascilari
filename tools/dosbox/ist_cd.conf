# DOSBox-X reference configuration for IST.EXE (the oracle for 1:1 comparisons).
# usage: dosbox-x.exe -conf tools/dosbox/ist.conf     (run from the repo root)
[sdl]
output        = surface
windowresolution = original
autolock      = false

[dosbox]
machine       = vgaonly
memsize       = 16
captures      = build/capture
quit warning  = false
working directory option = noprompt

[cpu]
core          = normal
cputype       = 386
cycles        = fixed 20000

[dos]
ems           = true
xms           = true
umb           = true

[mixer]
rate          = 44100

[sblaster]
sbtype        = sb16
sbbase        = 220
irq           = 5
dma           = 1
hdma          = 5

[render]
aspect        = false
scaler        = none

[autoexec]
mount c "orig"
imgmount d "build/cd/Istanbul Efsaneleri - Lale Savascilari - Birinci Boeluem (Turkey) (Simulated).cue" -t iso
c:
IST.EXE
